<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>disdroc YouTube Music Linker</title>
<style>
  :root { color-scheme: dark; }
  body {
    width: 280px; margin: 0; padding: 16px;
    background: #1e1f22; color: #dbdee1;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  h1 { font-size: 14px; margin: 0 0 4px; color: #f2f3f5; }
  p.hint { color: #949ba4; margin: 0 0 12px; font-size: 12px; }
  input {
    width: 100%; box-sizing: border-box; background: #2b2d31; border: 1px solid #3f4147;
    border-radius: 6px; padding: 8px 10px; color: #dbdee1; font-family: ui-monospace, monospace;
    font-size: 15px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;
  }
  input:focus { outline: none; border-color: #5865f2; }
  button {
    width: 100%; background: #5865f2; border: none; border-radius: 6px; color: #fff;
    font-weight: 600; font-size: 13px; padding: 9px; cursor: pointer;
  }
  button:hover { background: #4752c4; }
  button:disabled { opacity: .6; cursor: default; }
  #status {
    margin-top: 12px; padding: 8px 10px; border-radius: 6px; font-size: 12px; display: none;
  }
  #status.show { display: block; }
  #status.armed { background: rgba(88,101,242,.15); color: #8ea1ff; }
  #status.linking { background: rgba(240,178,50,.15); color: #f0b232; }
  #status.linked { background: rgba(35,165,90,.15); color: #23a55a; }
  #status.failed { background: rgba(242,63,67,.15); color: #f23f43; }
</style>
</head>
<body>
  <h1>disdroc YouTube Music Linker</h1>
  <p class="hint">Paste the code disdroc showed you, then open (or switch to) music.youtube.com while logged in.</p>
  <input id="code" placeholder="CODE" maxlength="16" autocomplete="off" spellcheck="false">
  <button id="save">Link account</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>

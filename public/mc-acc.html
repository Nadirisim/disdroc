<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" href="/assets/icon-192.png?v=2">
  <title data-en="Minecraft account — disdroc" data-tr="Minecraft hesabı — disdroc">Minecraft account — disdroc</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .mc-wrap { max-width: 520px; }
    .mc-acct { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
               border-radius:10px; padding:16px; margin:14px 0; text-align:left; }
    .mc-acct h3 { margin:0 0 2px; display:flex; align-items:center; gap:8px; }
    .mc-acct .sub { color:#8b93a7; font-size:13px; margin:0 0 12px; }
    .mc-acct label { display:block; font-size:12px; color:#8b93a7; margin:10px 0 4px; letter-spacing:.03em; }
    .mc-acct input { width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px;
                     border:1px solid rgba(255,255,255,0.12); background:rgba(0,0,0,0.25); color:#e6e8ee; }
    .mc-row { display:flex; gap:10px; margin-top:14px; }
    .mc-row button { flex:1; }
    .btn-ghost { background:rgba(255,255,255,0.06); color:#e6e8ee; }
    .btn-danger { background:#b3413a; color:#fff; }
    .mc-msg { font-size:13px; margin-top:10px; min-height:16px; }
    .mc-msg.ok { color:#7ee0a8; }
    .mc-msg.err { color:#ff8a8a; }
    .mc-hint { color:#8b93a7; font-size:12px; margin-top:6px; }
    .mc-empty { color:#8b93a7; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card mc-wrap" id="card">
      <div class="brand" style="margin-bottom:14px"><span class="dot"></span> disdroc</div>
      <h2 id="title" data-en="Minecraft account" data-tr="Minecraft hesabı">Minecraft account</h2>
      <p class="muted" id="desc">Manage your connected Minecraft account.</p>
      <div class="error" id="err"></div>
      <div id="list"></div>
      <div class="alt"><a href="/login" id="loginLink" style="display:none" data-en="Log in to disdroc first" data-tr="Önce disdroc'a giriş yap">Log in to disdroc first</a></div>
      <div class="alt"><a href="/app" data-en="← Back to disdroc" data-tr="← disdroc'a dön">← Back to disdroc</a></div>
    </div>
  </div>
  <script src="/js/lang.js"></script>
  <script src="/js/mc-acc.js"></script>
</body>
</html>
